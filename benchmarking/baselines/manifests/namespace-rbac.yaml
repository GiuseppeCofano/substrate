# Namespace and permissions for the agentsession baselines: the boomer
# workers in "benchmarking" create one Pod or SandboxClaim per session here.
apiVersion: v1
kind: Namespace
metadata:
  name: benchmark-sandboxes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentsession-sandboxes
  namespace: benchmark-sandboxes
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["create", "get", "delete"]
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxclaims"]
  verbs: ["create", "get", "delete"]
- apiGroups: ["extensions.agents.x-k8s.io"]
  resources: ["sandboxwarmpools", "sandboxtemplates"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentsession-sandboxes
  namespace: benchmark-sandboxes
subjects:
- kind: ServiceAccount
  name: default
  namespace: benchmarking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentsession-sandboxes
